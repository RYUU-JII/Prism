<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prism Window</title>
  </head>
  <body>
    <script>
      (function () {
        const params = new URLSearchParams(window.location.search);
        if (!params.has("mode")) params.set("mode", "window");
        const target = chrome.runtime.getURL(`sidepanel/dist/index.html?${params.toString()}`);
        window.location.replace(target);
      })();
    </script>
  </body>
</html>
