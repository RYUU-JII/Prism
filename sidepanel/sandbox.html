<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Prism Sandbox</title>
  <style id="prism-internal-styles">
    /* --- [1. Base layout styles] --- */
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
      color: #111;
    }

    /* Root container styles applied inside the sandbox frame */
    #prism-root {
      height: 100%;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      background: #ffffff;
      overflow: hidden;
      position: relative;
    }

    #prism-root.mode-html {
      height: 100%;
      min-height: 0;
      padding: 0;
      background: transparent;
      display: contents;
    }

    /* Utility and error states */
    .prism-empty {
      background: #f6f7fb;
      color: #5c6370;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    .prism-error {
      background: #ffe9ea;
      color: #b30024;
      white-space: pre-wrap;
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
    }

    pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 8px;
      overflow: auto;
    }

    /* Dark theme overrides */
    .dark #prism-root {
      background: #111;
      color: #fff;
    }
  </style>
  <link rel="stylesheet" href="tailwind.css" />
  <script type="importmap" id="prism-import-map">
    {
      "imports": {
        "dayjs": "./vendor/dayjs-shim.mjs",
        "react": "./vendor/react-shim.mjs",
        "react-dom": "./vendor/react-dom-shim.mjs",
        "react-dom/client": "./vendor/react-dom-client-shim.mjs",
        "react/jsx-runtime": "./vendor/react-jsx-runtime-shim.mjs",
        "react/jsx-dev-runtime": "./vendor/react-jsx-dev-runtime-shim.mjs",
        "three": "./vendor/three.module.js",
        "three/addons/": "./vendor/three-addons/",
        "three/examples/jsm/": "./vendor/three-addons/",
        "vue": "./vendor/vue-shim.mjs"
      }
    }
  </script>
</head>

<body>
  <div id="prism-root">
    <div class="prism-empty">Waiting for refraction...</div>
  </div>

  <script type="module" src="./sandbox/runtime.js"></script>
</body>

</html>
